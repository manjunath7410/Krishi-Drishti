    <script>
      // Safeguard console methods against DataCloneError during postMessage serialization in iframe hosts
      (function() {
        const methods = ['log', 'debug', 'info', 'warn', 'error'];
        function sanitize(val, depth, seen) {
          if (depth > 3) return '[Object]';
          if (val === null || val === undefined) return val;
          const t = typeof val;
          if (t === 'function') return '[Function]';
          if (t !== 'object') return val;
          if (val instanceof Error) return { name: val.name, message: val.message };
          if (seen.has(val)) return '[Circular]';
          seen.add(val);
          if (Array.isArray(val)) return val.map(item => sanitize(item, depth + 1, seen));
          try {
            const out = {};
            for (const k of Object.keys(val)) {
              if (k === 'adapter' || typeof val[k] === 'function') {
                out[k] = '[Function]';
              } else {
                out[k] = sanitize(val[k], depth + 1, seen);
              }
            }
            return out;
          } catch {
            return String(val);
          }
        }
        methods.forEach(function(m) {
          const original = console[m];
          if (typeof original === 'function') {
            console[m] = function(...args) {
              try {
                const seen = new WeakSet();
                const safeArgs = args.map(a => sanitize(a, 0, seen));
                original.apply(console, safeArgs);
              } catch {
                try {
                  original.apply(console, args.map(a => String((a && a.message) || a)));
                } catch {}
              }
            };
          }
        });
      })();
    </script>
